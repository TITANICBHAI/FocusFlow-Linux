app-id: com.focusflow.FocusFlow
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: focusflow

# These are the least permissions needed for a desktop build. Linux
# enforcement that needs host-level privileges remains outside the Flatpak
# sandbox and must not be advertised as fully equivalent to the native
# packages until it has been tested on the target desktop session.
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=home

modules:
  - name: focusflow
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/openjdk17/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
    build-commands:
      - chmod +x gradlew
      - ./gradlew createDistributable --no-daemon -Pfocusflow.java.version=17
      - APP_DIR="$(find build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d -print -quit)" && test -n "$APP_DIR"
      - APP_DIR="$(find build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d -print -quit)" && install -d /app/lib/focusflow && cp -a "$APP_DIR"/. /app/lib/focusflow/
      - APP_LAUNCHER="$(find /app/lib/focusflow -maxdepth 3 -type f -name FocusFlow -executable -print -quit)" && test -n "$APP_LAUNCHER" && install -d /app/bin && printf '#!/bin/sh\nexec "%s" "$@"\n' "$APP_LAUNCHER" > /app/bin/focusflow && chmod +x /app/bin/focusflow
      - install -Dm644 packaging/flatpak/com.focusflow.FocusFlow.desktop /app/share/applications/com.focusflow.FocusFlow.desktop
      - install -Dm644 packaging/flatpak/com.focusflow.FocusFlow.metainfo.xml /app/share/metainfo/com.focusflow.FocusFlow.metainfo.xml
      - install -Dm644 src/main/resources/focusflow_256.png /app/share/icons/hicolor/256x256/apps/com.focusflow.FocusFlow.png
    sources:
      - type: dir
        path: ../..