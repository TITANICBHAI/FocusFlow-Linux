name: Publish Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of build-windows workflow to pull artifacts from (leave blank → latest successful)'
        required: false
        default: ''
      linux_run_id:
        description: 'Run ID of build-linux workflow to pull artifacts from (leave blank → latest successful)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Read version from Gradle ───────────────────────────────────────────
      - name: Read version from build.gradle.kts
        id: ver
        run: |
          VERSION=$(grep -oP '(?<=^version = ")[^"]+' build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # ── 2. Parse changelog entry for this version from ChangelogScreen.kt ────
      - name: Parse changelog
        id: cl
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          version = os.environ["VERSION"]
          src     = open("src/main/kotlin/com/focusflow/ui/screens/ChangelogScreen.kt").read()

          # Find the ChangelogEntry block that matches this version.
          # Each entry starts at `ChangelogEntry(` and ends just before the next one (or end of list).
          pattern = (
              r'ChangelogEntry\(\s*'
              r'version\s*=\s*"' + re.escape(version) + r'"'
              r'.*?'
              r'(?=ChangelogEntry\(|\)\s*\n\s*//|$)'
          )
          m = re.search(pattern, src, re.DOTALL)

          if not m:
              print(f"::warning::No changelog entry found for v{version}; release body will skip changelog section.")
              body = ""
          else:
              block = m.group(0)

              date_m  = re.search(r'date\s*=\s*"([^"]+)"',  block)
              badge_m = re.search(r'badge\s*=\s*"([^"]+)"', block)
              date    = date_m.group(1)  if date_m  else ""
              badge   = badge_m.group(1) if badge_m else ""

              changes = re.findall(r'"([A-Z]+)"\s+to\s+"([^"]+)"', block)

              # Emoji map
              ICONS = {
                  "NEW":  "🆕",
                  "FIX":  "🐛",
                  "SEC":  "🔐",
                  "IMP":  "🔧",
                  "UPD":  "📝",
                  "PERF": "⚡",
              }
              LABELS = {
                  "NEW":  "New",
                  "FIX":  "Fix",
                  "SEC":  "Security",
                  "IMP":  "Improvement",
                  "UPD":  "Updated",
                  "PERF": "Performance",
              }

              # Group changes by tag
              from collections import defaultdict
              grouped = defaultdict(list)
              order   = []
              for tag, desc in changes:
                  if tag not in grouped:
                      order.append(tag)
                  grouped[tag].append(desc)

              rows = []
              for tag in order:
                  icon  = ICONS.get(tag,  "•")
                  label = LABELS.get(tag, tag)
                  for desc in grouped[tag]:
                      rows.append(f"| {icon} **{label}** | {desc} |")

              changelog_table = (
                  "| | |\n"
                  "|---|---|\n"
                  + "\n".join(rows)
              )

              badge_str = f"&nbsp;`{badge}`" if badge else ""
              date_str  = f"_{date}_" if date else ""

              body = f"""\
          <!-- FOCUSFLOW RELEASE BODY — generated by release.yml -->
          <div align="center">

          # 🔒 FocusFlow v{version}

          **Deep Focus. Real Enforcement. No Workarounds.**

          {date_str}{badge_str}

          </div>

          ---

          ## 📦 Downloads

          | | Format | File | Notes |
          |:---:|---|---|---|
          | 🟢 | **EXE** _(Recommended)_ | `FocusFlow-{version}.exe` | Bundled JRE · ~105 MB · run and install |
          | 📦 | **MSI** | `FocusFlow-{version}.msi` | Enterprise / IT / Group Policy deployment |
          | 🪟 | **MSIX** | `FocusFlow-{version}-x64.msix` | Sideload via `Add-AppxPackage` in PowerShell |

          > 💡 **First time?** Download the **EXE** — it bundles everything and runs on any Windows 10/11 machine without extra steps.

          ---

          ## 🗒️ What's New in v{version}

          {changelog_table}

          ---

          ## ⚡ Features at a Glance

          | Category | Details |
          |---|---|
          | 🛡️ **App Blocking** | `SetWinEventHook` instant kill + 500 ms polling fallback via JNA |
          | 🌐 **Network Blocking** | Live Windows Firewall rules via `netsh` + `New-NetFirewallRule` |
          | ☢️ **Nuclear Mode** | Blocks Task Manager, terminals, registry editors + 30 escape routes |
          | 🖥️ **Focus Launcher** | CBT-style kiosk — replaces desktop, PIN-gated breaks, hard-lock mode |
          | 📅 **Schedules & Allowances** | Weekly timetable blocking + per-app daily time limits |
          | 🔑 **PIN System** | Session PIN, Global PIN, Nuclear Mode PIN — all independent, SHA-256 hashed |
          | 🔔 **System Integration** | Tray icon, balloon notifications, auto-start, weekly focus report |

          ---

          <sub>
          Built from commit <code>${{ github.sha }}</code> &nbsp;·&nbsp;
          <a href="https://github.com/${{ github.repository }}/blob/main/src/main/kotlin/com/focusflow/ui/screens/ChangelogScreen.kt">Full changelog in source</a>
          </sub>
          """

          # Write to GITHUB_OUTPUT using multiline delimiter
          delimiter = "RELEASE_BODY_EOF"
          out_file  = os.environ.get("GITHUB_OUTPUT", "/dev/stdout")
          with open(out_file, "a") as f:
              f.write(f"body<<{delimiter}\n")
              f.write(body)
              f.write(f"\n{delimiter}\n")

          print(f"Changelog parsed — {len(changes)} change(s) for v{version}")
          PYEOF

      # ── 3. Resolve build run IDs (Windows + Linux) ───────────────────────────
      - name: Resolve Windows build run ID
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT="${{ inputs.run_id }}"
          if [ -n "$INPUT" ]; then
            echo "run_id=$INPUT" >> "$GITHUB_OUTPUT"
            echo "Using specified Windows run ID: $INPUT"
          else
            RUN_ID=$(gh run list \
              --workflow build-windows.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::No successful build-windows run found. Run build-windows.yml first."
              exit 1
            fi
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Using latest successful Windows build run ID: $RUN_ID"
          fi

      - name: Resolve Linux build run ID
        id: linux_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT="${{ inputs.linux_run_id }}"
          if [ -n "$INPUT" ]; then
            echo "run_id=$INPUT" >> "$GITHUB_OUTPUT"
            echo "Using specified Linux run ID: $INPUT"
          else
            RUN_ID=$(gh run list \
              --workflow build-linux.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::warning::No successful build-linux run found — Linux assets will be skipped."
              echo "run_id=" >> "$GITHUB_OUTPUT"
            else
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Using latest successful Linux build run ID: $RUN_ID"
            fi
          fi

      # ── 4. Download build artifacts ───────────────────────────────────────────
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: FocusFlow-Windows-EXE
          path: ./dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.run.outputs.run_id }}

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: FocusFlow-Windows-MSI
          path: ./dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.run.outputs.run_id }}
          merge-multiple: true

      - name: Download MSIX
        uses: actions/download-artifact@v4
        with:
          name: FocusFlow-Windows-MSIX
          path: ./dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.run.outputs.run_id }}
          merge-multiple: true

      - name: Download Deb
        if: steps.linux_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: focusflow-deb
          path: ./dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.linux_run.outputs.run_id }}
          merge-multiple: true

      - name: Download RPM
        if: steps.linux_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: focusflow-rpm
          path: ./dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.linux_run.outputs.run_id }}
          merge-multiple: true

      - name: Download AppImage
        if: steps.linux_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: focusflow-appimage
          path: ./dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.linux_run.outputs.run_id }}
          merge-multiple: true

      - name: Verify artifacts match expected version
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        run: |
          echo "Checking artifacts in dist/ for version $EXPECTED ..."
          ls -lh dist/ 2>/dev/null || true

          # Find the EXE — it's the most reliable version indicator
          EXE=$(ls dist/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::No EXE found in dist/ — did the artifact download fail?"
            exit 1
          fi

          BASENAME=$(basename "$EXE")
          echo "Found EXE: $BASENAME"

          if [[ "$BASENAME" != *"$EXPECTED"* ]]; then
            echo "::error::Version mismatch! build.gradle.kts says v$EXPECTED but the artifact is '$BASENAME'."
            echo "::error::The build run you selected was probably built from a different version."
            echo "::error::Re-run build-windows.yml on the current commit, then retry this release workflow."
            exit 1
          fi

          echo "✅ Version confirmed: $BASENAME contains $EXPECTED"

           shopt -s nullglob
           for pattern in '*.deb' '*.rpm' '*.AppImage'; do
             matches=(dist/$pattern)
             if [ "${#matches[@]}" -ne 1 ]; then
               echo "::error::Expected exactly one $pattern in dist/, found ${#matches[@]}."
               exit 1
             fi
             linux_name=$(basename "${matches[0]}")
             if [[ "$linux_name" != *"$EXPECTED"* ]]; then
               echo "::error::Linux artifact '$linux_name' does not contain version $EXPECTED."
               exit 1
             fi
           done
           echo "✅ Required Linux artifacts confirmed."

      - name: Generate release checksums
        run: |
          cp install.sh dist/install.sh
          mapfile -t RELEASE_FILES < <(find dist -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' -printf '%f\n' | sort)
          [ "${#RELEASE_FILES[@]}" -gt 0 ] || {
            echo "::error::No release files available for checksum generation."
            exit 1
          }
          (
            cd dist
            sha256sum "${RELEASE_FILES[@]}" > SHA256SUMS
          )
          echo "Generated dist/SHA256SUMS:"
          cat dist/SHA256SUMS

      # ── 5. Sentry release — hard-fail if auth token missing ──────────────────
      - name: Verify SENTRY_AUTH_TOKEN is configured
        run: |
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN secret is not set."
            echo "::error::Go to GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Name: SENTRY_AUTH_TOKEN   Value: new token from sentry.io → User Settings → Auth Tokens"
            echo "::error::Required scopes: project:releases  org:read"
            exit 1
          fi
          echo "SENTRY_AUTH_TOKEN configured ✓"

      - name: Create and finalize Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: tbtechs
          SENTRY_PROJECT: focusflow
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          RELEASE="focusflow@${VERSION}"

          # Install sentry-cli
          curl -sL https://sentry.io/get-cli/ | SENTRY_CLI_VERSION="latest" bash
          echo "sentry-cli version: $(sentry-cli --version)"

          # Create the release
          sentry-cli releases new "$RELEASE"

          # Associate commits — ties crashes to the exact commit that introduced them
          sentry-cli releases set-commits "$RELEASE" --auto || \
            echo "::warning::set-commits failed (no git history or missing org:read scope) — continuing"

          # Finalize marks the release as deployed so Sentry knows it's live
          sentry-cli releases finalize "$RELEASE"

          echo "✓ Sentry release $RELEASE created and finalized"

      # ── 6. Create or update the version tag ───────────────────────────────────
      - name: Create version tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.ver.outputs.version }}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `refs/tags/${tag}`,
                sha:   context.sha
              });
              console.log(`Created tag ${tag}`);
            } catch (e) {
              if (e.status === 422) {
                // Tag already exists — move it to current commit
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  ref:   `tags/${tag}`,
                  sha:   context.sha,
                  force: true
                });
                console.log(`Updated existing tag ${tag} to ${context.sha}`);
              } else {
                throw e;
              }
            }

      # ── 7. Publish the release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   v${{ steps.ver.outputs.version }}
          name:       "FocusFlow v${{ steps.ver.outputs.version }}"
          body:       ${{ steps.cl.outputs.body }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.msix
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/install.sh
            dist/SHA256SUMS
          fail_on_unmatched_files: true
