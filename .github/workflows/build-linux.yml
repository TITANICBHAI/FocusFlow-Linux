name: Build Linux Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19"
          distribution: temurin
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Install Debian runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool wmctrl

      - name: Build Debian package
        run: |
          chmod +x gradlew
          ./gradlew packageDeb --no-daemon

      - name: Add runtime dependencies to Debian metadata
        run: |
          DEB="$(find build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB" || { echo "::error::No Debian package was produced."; exit 1; }
          rm -rf /tmp/focusflow-deb-repack
          dpkg-deb -R "$DEB" /tmp/focusflow-deb-repack
          python3 - <<'PY'
          import re
          path = "/tmp/focusflow-deb-repack/DEBIAN/control"
          control = open(path).read()
          match = re.search(r"^Depends:(.*(?:\n[ \t].*)*)", control, re.MULTILINE)
          existing = match.group(1).strip().replace("\n ", " ").replace("\n\t", " ") if match else ""
          merged = ", ".join(dict.fromkeys(filter(None, [existing, "xdotool", "wmctrl"])))
          control = re.sub(r"^Depends:.*(?:\n[ \t].*)*\n?", "", control, flags=re.MULTILINE)
          field = f"Depends: {merged}\n"
          control = control.replace("Description:", field + "Description:", 1)
          open(path, "w").write(control)
          PY
          dpkg-deb -b /tmp/focusflow-deb-repack "$DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-deb
          path: build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19"
          distribution: temurin
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio xdotool wmctrl
          command -v rpmbuild >/dev/null || {
            echo "::error::rpmbuild is required to produce the RPM."
            exit 1
          }

      - name: Build RPM package
        run: |
          chmod +x gradlew
          ./gradlew packageRpm --no-daemon

      - name: Add runtime dependencies to RPM metadata
        run: |
          RPM="$(find build/compose/binaries/main/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$RPM" || { echo "::error::No RPM package was produced."; exit 1; }
          RPM="$(realpath "$RPM")"
          NAME="$(rpm -qp --queryformat '%{NAME}' "$RPM")"
          VERSION="$(rpm -qp --queryformat '%{VERSION}' "$RPM")"
          RELEASE="$(rpm -qp --queryformat '%{RELEASE}' "$RPM")"
          ARCH="$(rpm -qp --queryformat '%{ARCH}' "$RPM")"
          SUMMARY="$(rpm -qp --queryformat '%{SUMMARY}' "$RPM")"
          LICENSE="$(rpm -qp --queryformat '%{LICENSE}' "$RPM")"
          EXTRACT=/tmp/focusflow-rpm-payload
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          (cd "$EXTRACT" && rpm2cpio "$RPM" | cpio -idm --quiet)
          FILES=/tmp/focusflow-rpm-files.lst
          find "$EXTRACT" -type d | sed "s|${EXTRACT}||" | grep -v '^$' | sort | sed 's|^|%dir |' > "$FILES"
          find "$EXTRACT" ! -type d | sed "s|${EXTRACT}||" | sort >> "$FILES"
          mkdir -p "$HOME/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC="$HOME/rpmbuild/SPECS/${NAME}.spec"
          cat > "$SPEC" <<EOF
          Name:       ${NAME}
          Version:    ${VERSION}
          Release:    ${RELEASE}
          Summary:    ${SUMMARY}
          License:    ${LICENSE}
          BuildArch:  ${ARCH}
          AutoReqProv: no
          Requires:   xdotool
          Requires:   wmctrl

          %description
          ${SUMMARY}

          %install
          cp -r ${EXTRACT}/. %{buildroot}/

          %files -f ${FILES}
          EOF
          rpmbuild -bb \
            --define "_rpmdir $(dirname "$RPM")" \
            --define "_build_name_fmt %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm" \
            "$SPEC"
          rpm -qp --requires "$RPM" | grep -qx xdotool
          rpm -qp --requires "$RPM" | grep -qx wmctrl

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-rpm
          path: build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19"
          distribution: temurin
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 imagemagick squashfs-tools file wget xdotool wmctrl

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x gradlew
          ./gradlew packageAppImage --no-daemon
          OUT="build/compose/binaries/main/appImage"
          mkdir -p "$OUT"
          if find "$OUT" -maxdepth 1 -name '*.AppImage' -print -quit | grep -q .; then
            exit 0
          fi

          APP_DIR="$(find build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d -print -quit)"
          test -n "$APP_DIR" || { echo "::error::Compose did not produce an application directory."; exit 1; }
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          test -n "$VERSION" || { echo "::error::Could not read project version."; exit 1; }
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          APPDIR=/tmp/FocusFlow.AppDir
          rm -rf "$APPDIR"
          cp -a "$APP_DIR" "$APPDIR"
          cat > "$APPDIR/FocusFlow.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=FocusFlow
          Exec=FocusFlow
          Icon=focusflow
          Type=Application
          Categories=Utility;
          Comment=Focus & productivity app with real app blocking
          DESKTOP
          cp src/main/resources/focusflow.png "$APPDIR/focusflow.png"
          LAUNCHER="$(find "$APPDIR" -maxdepth 3 -type f -name FocusFlow -executable -print -quit)"
          test -n "$LAUNCHER" || { echo "::error::FocusFlow launcher was not found."; exit 1; }
          ln -sf "$(realpath --relative-to="$APPDIR" "$LAUNCHER")" "$APPDIR/AppRun"
          ARCH=x86_64 /tmp/appimagetool "$APPDIR" "$OUT/FocusFlow-${VERSION}-x86_64.AppImage"
          test -x "$OUT/FocusFlow-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-appimage
          path: build/compose/binaries/main/appImage/*.AppImage
          if-no-files-found: error

  validate:
    name: Validate all Linux artifacts
    needs: [build-deb, build-rpm, build-appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio file fuse libfuse2 squashfs-tools

      - name: Download Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-deb
          path: build/compose/binaries/main/deb

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-rpm
          path: build/compose/binaries/main/rpm

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-appimage
          path: build/compose/binaries/main/appImage

      - name: Restore AppImage executable permission
        run: chmod +x build/compose/binaries/main/appImage/*.AppImage

      - name: Validate package metadata and payloads
        run: |
          chmod +x scripts/validate-linux-packages.sh
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          scripts/validate-linux-packages.sh build/compose/binaries/main "$VERSION"
