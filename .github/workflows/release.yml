name: Publish Linux Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Linux Packages workflow run ID (blank uses latest successful run)"
        required: false
        default: ""
      channels_run_id:
        description: "Linux distribution channels workflow run ID (blank uses latest successful run)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          test -n "$VERSION" || { echo "::error::Could not read project version."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve Linux build run
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            [[ "$INPUT_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "::error::run_id must be numeric."
              exit 1
            }
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(gh run list \
              --workflow build-linux.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Build Linux Packages run was found."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using Linux build run $RUN_ID"

      - name: Resolve distribution channels run
        id: channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CHANNELS_RUN_ID: ${{ inputs.channels_run_id }}
        run: |
          if [ -n "$INPUT_CHANNELS_RUN_ID" ]; then
            [[ "$INPUT_CHANNELS_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "::error::channels_run_id must be numeric."
              exit 1
            }
            RUN_ID="$INPUT_CHANNELS_RUN_ID"
          else
            RUN_ID="$(gh run list \
              --workflow build-linux-channels.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Linux distribution channels run was found."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using distribution channels run $RUN_ID"

      - name: Download Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-deb
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run_id }}
          merge-multiple: true

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-rpm
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run_id }}
          merge-multiple: true

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-appimage
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run_id }}
          merge-multiple: true

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-flatpak
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.channels.outputs.run_id }}
          merge-multiple: true

      - name: Download Snap artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-snap
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.channels.outputs.run_id }}
          merge-multiple: true

      - name: Download AUR recipe artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-aur
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.channels.outputs.run_id }}
          merge-multiple: true

      - name: Download COPR and OBS recipe artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-copr-obs
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.channels.outputs.run_id }}
          merge-multiple: true

      - name: Download Launchpad source artifact
        uses: actions/download-artifact@v4
        with:
          name: focusflow-launchpad
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.channels.outputs.run_id }}
          merge-multiple: true

      - name: Verify release artifacts
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          debs=(dist/*.deb)
          rpms=(dist/*.rpm)
          appimages=(dist/*.AppImage)
          flatpaks=(dist/*.flatpak)
          snaps=(dist/*.snap)
          aur_recipes=(dist/*-aur.tar.gz)
          copr_obs_recipes=(dist/*-copr-obs.tar.gz)
          launchpad_sources=(dist/*.dsc)
          [[ ${#debs[@]} -eq 1 ]] || { echo "::error::Expected one .deb."; exit 1; }
          [[ ${#rpms[@]} -eq 1 ]] || { echo "::error::Expected one .rpm."; exit 1; }
          [[ ${#appimages[@]} -eq 1 ]] || { echo "::error::Expected one AppImage."; exit 1; }
          [[ ${#flatpaks[@]} -eq 1 ]] || { echo "::error::Expected one Flatpak."; exit 1; }
          [[ ${#snaps[@]} -eq 1 ]] || { echo "::error::Expected one Snap."; exit 1; }
          [[ ${#aur_recipes[@]} -eq 1 ]] || { echo "::error::Expected one AUR recipe archive."; exit 1; }
          [[ ${#copr_obs_recipes[@]} -eq 1 ]] || { echo "::error::Expected one COPR/OBS recipe archive."; exit 1; }
          [[ ${#launchpad_sources[@]} -eq 1 ]] || { echo "::error::Expected one Launchpad source descriptor."; exit 1; }
          for file in "${debs[0]}" "${rpms[0]}" "${appimages[0]}" \
                      "${flatpaks[0]}" "${snaps[0]}" "${aur_recipes[0]}" \
                      "${copr_obs_recipes[0]}" "${launchpad_sources[0]}"; do
            [[ "$(basename "$file")" == *"$EXPECTED_VERSION"* ]] || {
              echo "::error::Artifact does not contain version $EXPECTED_VERSION: $file"
              exit 1
            }
          done
          chmod +x "${appimages[0]}"

      - name: Generate checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          RPM="$(find dist -maxdepth 1 -name '*.rpm' -print -quit)"
          APPIMAGE="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          cp install.sh dist/install.sh
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | sort | xargs sha256sum > SHA256SUMS
          )
          cat > release-notes.md <<EOF
          # FocusFlow v${VERSION}

          Linux release artifacts:

          | Format | Artifact |
          |---|---|
          | Debian/Ubuntu | \`$(basename "$DEB")\` |
          | Fedora/RPM | \`$(basename "$RPM")\` |
          | Portable AppImage | \`$(basename "$APPIMAGE")\` |
          | Flatpak bundle | \`$(basename "$(find dist -maxdepth 1 -name '*.flatpak' -print -quit)")\` |
          | Snap bundle | \`$(basename "$(find dist -maxdepth 1 -name '*.snap' -print -quit)")\` |

          The release also includes AUR, COPR/OBS, and Launchpad recipe
          archives. Those channels still require their own publisher accounts,
          signing keys, and/or maintainer review before they become official
          store or repository listings.

          The release includes \`install.sh\` and \`SHA256SUMS\`.
          EOF

      - name: Create or update version tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
                sha: context.sha,
                force: true
              });
            }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FocusFlow v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
            dist/*.snap
            dist/*-aur.tar.gz
            dist/*-copr-obs.tar.gz
            dist/*.dsc
            dist/*.debian.tar.*
            dist/*.orig.tar.*
            dist/*.buildinfo
            dist/install.sh
            dist/SHA256SUMS
          fail_on_unmatched_files: true