name: Build Linux Distribution Channels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19"
          distribution: temurin
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install --noninteractive -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Sync Flatpak release metadata
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          sed -i -E "s/(<release version=\")[^\"]+/\1${VERSION}/" \
            packaging/flatpak/com.focusflow.FocusFlow.metainfo.xml

      - name: Build Flatpak
        run: |
          mkdir -p dist
          flatpak-builder \
            --force-clean \
            --disable-rofiles-fuse \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/com.focusflow.FocusFlow.yml
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          flatpak build-bundle \
            flatpak-repo \
            "dist/FocusFlow-${VERSION}.flatpak" \
            com.focusflow.FocusFlow \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          test -s "dist/FocusFlow-${VERSION}.flatpak"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  build-snap:
    name: Build Snap package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: "19"
          distribution: temurin
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Install Snapcraft
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap install snapcraft --classic

      - name: Sync Snap version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" snap/snapcraft.yaml

      - name: Build Snap
        run: |
          mkdir -p dist
          snapcraft pack --destructive-mode
          SNAP="$(find . -maxdepth 1 -name '*.snap' -print -quit)"
          test -n "$SNAP" || { echo "::error::Snapcraft did not produce a snap."; exit 1; }
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          mv "$SNAP" "dist/focusflow_${VERSION}_amd64.snap"
          test -s "dist/focusflow_${VERSION}_amd64.snap"

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-snap
          path: dist/*.snap
          if-no-files-found: error

  prepare-community-recipes:
    name: Prepare AUR, COPR, OBS, and Launchpad recipes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper-compat dpkg-dev rpm tar gzip

      - name: Validate recipe versions
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          grep -qx "pkgver=${VERSION}" aur/PKGBUILD
          grep -qx $'\tpkgver = '"${VERSION}" aur/.SRCINFO
          grep -q "Version: *${VERSION}" packaging/rpm/focusflow.spec
          grep -q "focusflow (${VERSION}-1)" packaging/launchpad/debian/changelog
          rpmspec -P packaging/rpm/focusflow.spec >/dev/null

      - name: Build Launchpad source package
        run: |
          set -eu
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          WORK="$(mktemp -d)"
          git archive --format=tar --prefix="focusflow-${VERSION}/" HEAD \
            > "$WORK/focusflow_${VERSION}.orig.tar"
          gzip -n "$WORK/focusflow_${VERSION}.orig.tar"
          tar -xzf "$WORK/focusflow_${VERSION}.orig.tar.gz" -C "$WORK"
          cp -a packaging/launchpad/debian "$WORK/focusflow-${VERSION}/debian"
          chmod +x \
            "$WORK/focusflow-${VERSION}/gradlew" \
            "$WORK/focusflow-${VERSION}/debian/rules"
          (
            cd "$WORK/focusflow-${VERSION}"
            dpkg-buildpackage -S -us -uc -d
          )
          mkdir -p dist/launchpad
          cp "$WORK"/focusflow_* dist/launchpad/

      - name: Build recipe archives
        run: |
          set -eu
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)"
          mkdir -p dist
          tar -czf "dist/focusflow-${VERSION}-aur.tar.gz" \
            -C aur PKGBUILD .SRCINFO README.md
          tar -czf "dist/focusflow-${VERSION}-copr-obs.tar.gz" \
            packaging/rpm/focusflow.spec \
            packaging/flatpak/com.focusflow.FocusFlow.desktop \
            src/main/resources/focusflow_256.png

      - name: Upload AUR recipe
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

      - name: Upload COPR and OBS recipe
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-copr-obs
          path: dist/*-copr-obs.tar.gz
          if-no-files-found: error

      - name: Upload Launchpad source package
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-launchpad
          path: dist/launchpad/*
          if-no-files-found: error