name: Build Linux Deb / Rpm / AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 19
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '19'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # rpm includes rpm2cpio; cpio is needed to repack and validate payloads.
          sudo apt-get install -y rpm cpio fuse libfuse2 imagemagick squashfs-tools file
          command -v rpmbuild >/dev/null 2>&1 || {
            echo "::error::rpmbuild is required to produce the validated RPM."
            exit 1
          }

      - name: Generate PNG icon (focusflow.png)
        run: |
          mkdir -p src/main/resources
          convert -size 256x256 xc:'#09090f' \
            -fill '#4fc3f7' -draw "arc 40,40 216,216 -50,140" \
            -fill '#7c4dff' -draw "arc 40,40 216,216 130,260" \
            -fill '#6699ee' -draw "rectangle 106,128 150,135" \
            src/main/resources/focusflow.png

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Grant execute permission for Linux package validator
        run: chmod +x scripts/validate-linux-packages.sh

      - name: Build Linux distribution
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./gradlew packageDeb packageRpm packageAppImage

      - name: Debug — list compose output
        if: always()
        run: |
          echo "=== All files under build/compose/binaries ==="
          find build/compose/binaries -type f 2>/dev/null | sort || echo "(none)"

      # ── AppImage: manual fallback if Compose Desktop appimagetool failed ─────
      # Compose Desktop 1.6.x downloads appimagetool at task time; in sandboxed
      # GitHub Actions environments it sometimes runs but produces no .AppImage.
      # We detect this and fall back to downloading appimagetool ourselves and
      # packaging the app/ directory that Compose Desktop always produces.
      - name: Package AppImage (manual fallback if Compose Desktop produced none)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE_OUT="build/compose/binaries/main/appImage"
          APP_DIR=$(find build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)

          if ls "$APPIMAGE_OUT"/*.AppImage 1>/dev/null 2>&1; then
            echo "✔  AppImage already present, skipping manual step."
            exit 0
          fi

          if [ -z "$APP_DIR" ]; then
            echo "::error::No app directory found under build/compose/binaries/main/app/ — cannot create AppImage."
            exit 1
          fi

          echo "App directory: $APP_DIR"
          VERSION=$(grep '^version' build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Version: $VERSION"

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # Build a minimal AppDir from what Compose Desktop produced
          APPDIR="/tmp/FocusFlow.AppDir"
          rm -rf "$APPDIR"
          cp -a "$APP_DIR" "$APPDIR"

          # Desktop entry (required by appimagetool)
          # Only registered XDG categories allowed; Productivity is not in the spec.
          cat > "$APPDIR/FocusFlow.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=FocusFlow
          Exec=FocusFlow
          Icon=focusflow
          Type=Application
          Categories=Utility;
          Comment=Focus & productivity app with real app blocking
          DESKTOP

          # Icon (256 px PNG)
          cp src/main/resources/focusflow.png "$APPDIR/focusflow.png"

          # AppRun symlink to the actual launcher
          LAUNCHER=$(find "$APPDIR" -maxdepth 2 -name "FocusFlow" -type f | head -1)
          if [ -n "$LAUNCHER" ]; then
            ln -sf "$(realpath --relative-to="$APPDIR" "$LAUNCHER")" "$APPDIR/AppRun" 2>/dev/null \
              || cp "$LAUNCHER" "$APPDIR/AppRun"
           else
            echo "::error::Could not find the FocusFlow launcher in the Compose app directory."
            exit 1
          fi

          mkdir -p "$APPIMAGE_OUT"
          ARCH=x86_64 /tmp/appimagetool "$APPDIR" \
            "$APPIMAGE_OUT/FocusFlow-${VERSION}-x86_64.AppImage"
          echo "✔  AppImage created."

      # ── Inject package dependencies into the .deb ──────────────────────────
      # Compose Desktop 1.6.x doesn't expose a packageDependencies DSL property
      # for the Linux target, so we repack the .deb here to merge xdotool +
      # wmctrl into the Depends field.  apt will then auto-install them
      # alongside FocusFlow so users never need a separate install step.
      - name: Inject Depends into .deb (xdotool, wmctrl)
        run: |
          DEB=$(ls build/compose/binaries/main/deb/*.deb | head -1)
          echo "Repacking: $DEB"
          mkdir -p /tmp/deb_repack
          dpkg-deb -R "$DEB" /tmp/deb_repack

          # Use Python to safely merge into existing Depends (handles
          # multi-line continuation fields that plain sed would orphan).
          python3 - <<'PYEOF'
          import re, sys

          ctrl_path = '/tmp/deb_repack/DEBIAN/control'
          ctrl = open(ctrl_path).read()

          # Extract existing Depends value (header + any continuation lines)
          m = re.search(r'^Depends:(.*(?:\n[ \t].*)*)' , ctrl, re.MULTILINE)
          existing = m.group(1).strip().replace('\n ', ' ').replace('\n\t', ' ') if m else ''

          # Build merged value: keep existing deps, add ours if not already there
          extra = [d for d in ['xdotool', 'wmctrl'] if d not in existing]
          merged = ', '.join(filter(None, [existing] + extra))

          # Remove old Depends block entirely (header + continuations)
          ctrl = re.sub(r'^Depends:.*(?:\n[ \t].*)*\n?', '', ctrl, flags=re.MULTILINE)

          # Insert merged Depends before Description (or append if no Description)
          new_field = f'Depends: {merged}\n'
          if 'Description:' in ctrl:
              ctrl = ctrl.replace('Description:', new_field + 'Description:', 1)
          else:
              ctrl = ctrl.rstrip('\n') + '\n' + new_field

          open(ctrl_path, 'w').write(ctrl)
          print('--- control file after patch ---')
          print(ctrl)
          PYEOF

          dpkg-deb -b /tmp/deb_repack "$DEB"
          echo "Repacked: $DEB"

      # ── Inject Requires into the .rpm ──────────────────────────────────────
      # rpmrebuild is not available on ubuntu-latest; we use rpm2cpio + rpmbuild.
      # Key: extract payload to a SEPARATE temp dir so %install can copy it into
      # the fresh %{buildroot} that rpmbuild creates — not the same directory.
      - name: Inject Requires into .rpm (xdotool, wmctrl)
        run: |
          RPM=$(ls build/compose/binaries/main/rpm/*.rpm 2>/dev/null | head -1)
          if [ -z "$RPM" ]; then echo "::error::No RPM found."; exit 1; fi
          RPM_ABS=$(realpath "$RPM")
          RPM_DIR=$(dirname "$RPM_ABS")
          echo "Patching Requires in: $RPM_ABS"

          # Query metadata
          NAME=$(rpm -qp --queryformat '%{NAME}' "$RPM_ABS")
          VER=$(rpm  -qp --queryformat '%{VERSION}' "$RPM_ABS")
          REL=$(rpm  -qp --queryformat '%{RELEASE}' "$RPM_ABS")
          ARCH_RPM=$(rpm -qp --queryformat '%{ARCH}' "$RPM_ABS")
          SUMMARY=$(rpm -qp --queryformat '%{SUMMARY}' "$RPM_ABS")
          LICENSE=$(rpm -qp --queryformat '%{LICENSE}' "$RPM_ABS")

          # Extract payload to a temp dir (NOT the rpmbuild BUILDROOT)
          EXTRACT=/tmp/rpm_payload
          rm -rf "$EXTRACT" && mkdir -p "$EXTRACT"
          cd "$EXTRACT" && rpm2cpio "$RPM_ABS" | cpio -idm --quiet 2>/dev/null; cd -

          # Build file list (dirs as %dir, regular files as plain paths)
          FILES_LIST=/tmp/rpm_files.lst
          find "$EXTRACT" -type d | sed "s|${EXTRACT}||" | grep -v '^$' | sort \
            | sed 's|^|%dir |' > "$FILES_LIST"
          find "$EXTRACT" ! -type d | sed "s|${EXTRACT}||" | sort >> "$FILES_LIST"

          # Write the spec
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          SPEC=~/rpmbuild/SPECS/${NAME}.spec
          cat > "$SPEC" <<SPECEOF
          Name:       ${NAME}
          Version:    ${VER}
          Release:    ${REL}
          Summary:    ${SUMMARY}
          License:    ${LICENSE}
          BuildArch:  ${ARCH_RPM}
          AutoReqProv: no
          Requires:   xdotool wmctrl

          %description
          ${SUMMARY}

          %install
          cp -r ${EXTRACT}/. %{buildroot}/

          %files -f /tmp/rpm_files.lst
          SPECEOF

          rpmbuild -bb \
            --define "_rpmdir ${RPM_DIR}" \
            --define "_build_name_fmt %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm" \
             "$SPEC"
           echo "✔  RPM Requires patched."

      - name: Validate Linux package metadata and contents
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)
          test -n "$VERSION" || { echo "::error::Could not read project version."; exit 1; }
          scripts/validate-linux-packages.sh build/compose/binaries/main "$VERSION"

      - name: Upload Deb artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: focusflow-deb
          path: build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload Rpm artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: focusflow-rpm
          path: build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: focusflow-appimage
          path: build/compose/binaries/main/appImage/*.AppImage
          if-no-files-found: error
